<div class="row clearfix">
    <div class="col-lg-12">
        <div class="card">

            <div class="header flex justify-between items-center p-4">
                <h2>Tabla Productos</h2>

                <button mat-raised-button color="primary" (click)="addProduct()">
                    <mat-icon>add</mat-icon>
                    Agregar
                </button>
            </div>

            <div class="body table-responsive p-4">

                <!-- BUSCADOR -->
                <mat-form-field appearance="outline" class="w-full mb-4">
                    <mat-label>Buscar</mat-label>
                    <input matInput (keyup)="applyFilter($event)">
                </mat-form-field>

                <!-- TABLA -->
                <table mat-table [dataSource]="dataSource" class="w-full">

                    <!-- IMAGEN -->
                    <ng-container matColumnDef="image">
                        <th mat-header-cell *matHeaderCellDef> Imagen </th>
                        <td mat-cell *matCellDef="let element">
                            <img 
                                [src]="element.image || 'https://via.placeholder.com/40'"
                                class="w-10 h-10 rounded-full border border-black/20 object-cover"
                            >
                        </td>
                    </ng-container>

                    <!-- TITLE -->
                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef> Nombre </th>
                        <td mat-cell *matCellDef="let element">
                        <span matTooltip="{{ element.title }}">
                            {{ truncate(element.title, 50) }}
                        </span>
                    </td>
                    </ng-container>

                    <!-- DESCRIPTION -->
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef> Descripción </th>
                        <td mat-cell *matCellDef="let element">
                            <span matTooltip="{{ element.description}}">
                            {{ truncate(element.description, 100) }}
                        </span>
                        </td>
                    </ng-container>

                    <!-- PRICE -->
                    <ng-container matColumnDef="price">
                        <th mat-header-cell *matHeaderCellDef> Precio </th>
                        <td mat-cell *matCellDef="let element">
                            ${{ element.price }}
                        </td>
                    </ng-container>

                    <!-- ACTIONS -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let element">

                        <!-- 🔥 AQUÍ EL FIX -->
                        <div class="flex items-center gap-2">

                            <button mat-icon-button color="primary" (click)="editProduct(element)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            <button mat-icon-button color="warn" (click)="deleteProduct(element.id)">
                                <mat-icon>delete</mat-icon>
                            </button>

                        </div>

                        </td>
                    </ng-container>

                    <!-- HEADER -->
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                    <!-- ROWS -->
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                </table>

                <!-- PAGINADOR -->
                <mat-paginator 
                    [pageSizeOptions]="[5, 10, 20]"
                    showFirstLastButtons>
                </mat-paginator>

            </div>

        </div>
    </div>
</div>
